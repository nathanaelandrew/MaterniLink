{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaterniLink</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts: Playfair for headings, Inter for body -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --sage-green: #8FA998;
            --sage-dark: #6C8474;
            --cream-bg: #FDFBF7;
            --cream-card: #FFFFFF;
            --text-main: #3E4A41;
            --accent-gold: #D4AF37;
        }

        body { 
            background-color: var(--cream-bg); 
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        h1, h2, h3, .navbar-brand {
            font-family: 'Playfair Display', serif;
            color: var(--text-main);
        }

        /* Professional Navbar */
        .navbar {
            background-color: var(--cream-bg);
            border-bottom: 1px solid rgba(143, 169, 152, 0.2);
            padding: 1.2rem 0;
        }

        .navbar-brand {
            font-size: 1.8rem;
            letter-spacing: -1px;
            color: var(--sage-dark) !important;
        }

        .btn-sage {
            background-color: var(--sage-green);
            color: white !important;
            border: none;
            padding: 0.6rem 1.5rem;
            border-radius: 50px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-sage:hover {
            background-color: var(--sage-dark);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .card {
            background: var(--cream-card);
            border: 1px solid rgba(143, 169, 152, 0.1);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(62, 74, 65, 0.03);
        }

        /* Style Form Inputs */
        input.form-control {
            background-color: #F9F7F2;
            border: 1px solid #E6E2D9;
            padding: 0.8rem;
            border-radius: 10px;
        }

        input.form-control:focus {
            border-color: var(--sage-green);
            box-shadow: 0 0 0 3px rgba(143, 169, 152, 0.1);
        }

            input.form-control {
                background-color: #F9F7F2; /* Creamy input background */
                border: 1px solid #E6E2D9;
                padding: 0.8rem 1rem;
                border-radius: 12px;
                color: var(--text-main);
                transition: all 0.3s ease;
            }
            
            input.form-control:focus {
                background-color: #FFFFFF;
                border-color: var(--sage-green);
                box-shadow: 0 0 0 4px rgba(143, 169, 152, 0.15);
            }
            
            .form-text ul {
                display: none; /* Hides the long list of password rules for a cleaner look */
            }

            .dropdown-menu {
                background-color: var(--cream-card);
            }
            
            .dropdown-item:hover {
                background-color: var(--cream-bg);
                color: var(--sage-dark);
            }
            
            .dropdown-toggle::after {
                margin-left: 0.8em;
                vertical-align: 0.1em;
            }
            
            .btn-sage {
                border-radius: 50px !important;
            }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg sticky-top">
                <!-- Inside templates/base.html navigation -->
        <div class="ms-auto d-flex align-items-center">
            {% if user.is_authenticated %}
                <div class="dropdown">
                    <button class="btn btn-sage dropdown-toggle d-flex align-items-center px-3 shadow-sm" 
                            type="button" id="profileDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                        <!-- User Icon (Optional but professional) -->
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" class="bi bi-person-circle me-2" viewBox="0 0 16 16">
                            <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"/>
                            <path fill-rule="evenodd" d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8zm8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1z"/>
                        </svg>
                        <span>Hi, {{ mother.first_name|default:user.username }}</span>
                    </button>
                    
                    <ul class="dropdown-menu dropdown-menu-end shadow-lg border-0 mt-2 p-2" 
                        aria-labelledby="profileDropdown" style="border-radius: 15px; min-width: 200px;">
                        
                        <li>
                            <a class="dropdown-item py-2 rounded-3" href="{% url 'profile:profile' %}">
                                <small class="text-muted d-block" style="font-size: 0.7rem;">ACCOUNT</small>
                                <b>View Profile</b>
                            </a>
                        </li>
                        
                        <li><hr class="dropdown-divider opacity-50"></li>
                        
                        <!-- Logout Button inside dropdown (Must be POST for Django 5.0) -->
                        <li>
                            <form action="{% url 'login:logout' %}" method="post" class="p-0 m-0">
                                {% csrf_token %}
                                <button type="submit" class="dropdown-item text-danger py-2 rounded-3 fw-bold">
                                    Log out
                                </button>
                            </form>
                        </li>
                    </ul>
                </div>
            {% else %}
                <a href="{% url 'login:login' %}" class="btn btn-sage shadow-sm px-4">Log in</a>
            {% endif %}
        </div>
    </nav>

    <!-- Message Alerts Container -->
    <div class="container mt-3">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show border-0 shadow-sm rounded-pill px-4" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endif %}
    </div>

    <div class="container mt-5">
        {% block content %}{% endblock %}
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
