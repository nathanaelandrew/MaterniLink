{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-5">
        <div class="card p-5">
            <div class="text-center mb-4">
                <h2 class="display-6">Welcome back.</h2>
                <p class="text-muted">Your journey to motherhood, supported.</p>
            </div>
            
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label small fw-bold">Username</label>
                    <input type="text" name="username" class="form-control" placeholder="Enter your username">
                </div>
                <div class="mb-4">
                    <label class="form-label small fw-bold">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="••••••••">
                </div>
                
                <div class="d-grid">
                    <button type="submit" class="btn btn-sage btn-lg">Sign In</button>
                </div>
            </form>
            
            <div class="text-center mt-4">
                <p class="small text-muted">
                    Don't have an account? 
                    <a href="{% url 'register:register' %}" class="text-decoration-none fw-bold" style="color: var(--sage-dark);">
                        Join MaterniLink
                    </a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
