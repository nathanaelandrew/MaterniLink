{% extends 'base.html' %}

{% block title %}Dashboard - MaterniLink{% endblock %}

{% block content %}
<div class="home-wrapper">
    <header class="home-header">
        <span class="home-brand">MaterniLink</span>
        <form action="{% url 'logout' %}" method="post" class="logout-form">
            {% csrf_token %}
            <button type="submit" class="btn-outline">Log out</button>
        </form>
    </header>

    <main class="home-main">
        <div class="dashboard-card">
            <h1>Hello, {{ user.username }}.</h1>
            <p class="text-secondary">How are you feeling today?</p>
            <p class="text-secondary" style="margin-top: 1rem;">This is your quiet space to track your journey.</p>
        </div>
    </main>
</div>
{% endblock %}
