{% extends 'base.html' %}

{% block title %}Login - MaterniLink{% endblock %}

{% block content %}
<div class="auth-card">
    <h2>Welcome Back</h2>
    <p class="subtitle">Log in to your dashboard.</p>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Log in</button>
    </form>

    <div class="footer-link">
        Don't have an account? <a href="{% url 'register' %}">Sign up</a>
    </div>
</div>
{% endblock %}
